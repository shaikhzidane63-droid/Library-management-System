<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Edit Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>Edit Admin</h3>

        </div>

        <div class="card-body">

            <form
                action="/update_admin/{{ admin[0] }}"
                method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                        type="text"
                        name="full_name"
                        value="{{ admin[1] }}"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Username

                    </label>

                    <input
                        type="text"
                        name="username"
                        value="{{ admin[2] }}"
                        class="form-control"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Role

                    </label>

                    <select
                        name="role"
                        class="form-select">

                        <option
                        {% if admin[4]=="Head Librarian" %}
                        selected
                        {% endif %}>
                        Head Librarian
                        </option>

                        <option
                        {% if admin[4]=="Librarian" %}
                        selected
                        {% endif %}>
                        Librarian
                        </option>

                        <option
                        {% if admin[4]=="Assistant" %}
                        selected
                        {% endif %}>
                        Assistant
                        </option>

                    </select>

                </div>

                <button
                    class="btn btn-warning">

                    Update Admin

                </button>

                <a
                    href="/admins"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
