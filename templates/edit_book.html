<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="{{ url_for('static', filename='images/college_logo.png') }}">

<title>Edit Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body class="bg-light">

{% include "_admin_nav.html" %}


<div id="mainContent" class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-warning text-dark">
                    <h3><i class="bi bi-pencil-fill"></i> Edit Book</h3>
                </div>

                <div class="card-body">

                    <form action="/update/{{ book[0] }}" method="POST">

                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" name="title" value="{{ book[1] }}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Author</label>
                            <input type="text" name="author" value="{{ book[2] }}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" name="category" value="{{ book[3] }}" class="form-control" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Quantity</label>
                            <input type="number" name="quantity" value="{{ book[4] }}" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-warning">Update Book</button>

                        <a href="/dashboard" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Back
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% include "_footer.html" %}

</body>
</html>
