<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Reset Student Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>

🔑 Reset Student Password

</h3>

</div>

<div class="card-body">

<h5 class="mb-4">

{{ member[0] }}

</h5>

<form method="POST">

<div class="mb-3">

<label>

New Password

</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="mb-4">

<label>

Confirm Password

</label>

<input
type="password"
name="confirm_password"
class="form-control"
required>

</div>

<button
class="btn btn-warning">

Update Password

</button>

<a
href="/members"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
