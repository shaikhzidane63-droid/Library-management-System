<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Add Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Add New Admin</h3>

        </div>

        <div class="card-body">

            <form action="/save_admin" method="POST">

                <div class="mb-3">

                    <label class="form-label">Full Name</label>

                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Username</label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Password</label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">Role</label>

                    <select
                        name="role"
                        class="form-select">

                        <option>Head Librarian</option>
                        <option selected>Librarian</option>
                        <option>Assistant</option>

                    </select>

                </div>

                <button class="btn btn-success">

                    Create Admin

                </button>

                <a href="/admins" class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
