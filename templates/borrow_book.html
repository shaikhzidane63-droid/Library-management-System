<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <link rel="icon" href="{{ url_for('static', filename='images/college_logo.png') }}">

<title>Borrow Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

{% include "_admin_nav.html" %}


<div id="mainContent" class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3><i class="bi bi-book-half"></i> Borrow Book</h3>
        </div>

        <div class="card-body">

            <h5 class="mb-4">
                Book:
                <strong>{{ book[1] }}</strong>
            </h5>

            <form action="/borrow_book/{{ book[0] }}" method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Select Member
                    </label>

                    <select
                        name="member_id"
                        class="form-select"
                        required>

                        <option value="">
                            -- Select Member --
                        </option>

                        {% for member in members %}

                        <option value="{{ member[0] }}">
                            {{ member[1] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Borrow Date
                    </label>

                    <input
                        type="date"
                        name="borrow_date"
                        id="borrowDateInput"
                        class="form-control"
                        value="{{ today }}"
                        max="{{ today }}"
                        required>

                    <div class="form-text">
                        Defaults to today. Set an earlier date if this book was
                        already issued and you're recording it after the fact.
                    </div>

                </div>

                <div class="alert alert-info d-flex align-items-center gap-2 mb-4">
                    <i class="bi bi-calendar-check fs-5"></i>
                    <span>
                        Due date will be
                        <strong id="dueDatePreview">—</strong>
                        (14-day loan period)
                    </span>
                </div>

                <button class="btn btn-primary">
                    <i class="bi bi-book-half"></i> Borrow Book
                </button>

                <a href="/dashboard" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

<script>
    (function () {
        var input = document.getElementById("borrowDateInput");
        var preview = document.getElementById("dueDatePreview");

        function updatePreview() {
            if (!input.value) {
                preview.textContent = "—";
                return;
            }
            var parts = input.value.split("-").map(Number);
            var borrowDate = new Date(parts[0], parts[1] - 1, parts[2]);
            borrowDate.setDate(borrowDate.getDate() + 14);
            preview.textContent = borrowDate.toLocaleDateString(undefined, {
                year: "numeric", month: "long", day: "numeric"
            });
        }

        input.addEventListener("change", updatePreview);
        updatePreview();
    })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% include "_footer.html" %}

</body>
</html>
