<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Borrow Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>📚 Borrow Book</h3>
        </div>

        <div class="card-body">

            <h5 class="mb-4">
                Book:
                <strong>{{ book[1] }}</strong>
            </h5>

            <form action="/borrow_book/{{ book[0] }}" method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Select Member
                    </label>

                    <select
                        name="member_id"
                        class="form-select"
                        required>

                        <option value="">
                            -- Select Member --
                        </option>

                        {% for member in members %}

                        <option value="{{ member[0] }}">
                            {{ member[1] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <button class="btn btn-primary">
                    Borrow Book
                </button>

                <a href="/dashboard" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
