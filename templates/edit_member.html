<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <link rel="icon" href="{{ url_for('static', filename='images/college_logo.png') }}">

<title>Edit Member</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

{% include "_admin_nav.html" %}


<div id="mainContent" class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">
            <h3><i class="bi bi-pencil-fill"></i> Edit Member</h3>
        </div>

        <div class="card-body">

            <form action="/update_member/{{ member[0] }}" method="POST">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ member[1] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ member[2] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ member[3] }}"
                        required>
                </div>

                <hr>

                <h5 class="text-primary mb-3">
                    <i class="bi bi-shield-lock-fill"></i> Student Login
                </h5>

                <div class="mb-4">
                    <label class="form-label">Username</label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        value="{{ member[4] or '' }}"
                        required>
                </div>

                <button
                    type="submit"
                    class="btn btn-warning">

                    <i class="bi bi-pencil-fill"></i> Update Member

                </button>

                <a
                    href="/members"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% include "_footer.html" %}

</body>

</html>
