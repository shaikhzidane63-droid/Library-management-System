<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="icon" href="{{ url_for('static', filename='images/college_logo.png') }}">

<title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/student.css') }}">

</head>

<body class="student-body">

{% include "_student_nav.html" %}

<div id="mainContent" class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <div class="display-1 text-primary">

                            <i class="bi bi-person-circle"></i>

                        </div>

                        <h2 class="fw-bold">

                            My Profile

                        </h2>

                    </div>

                    <table class="table table-bordered">

                        <tr>

                            <th width="35%">

                                Full Name

                            </th>

                            <td>

                                {{ student[0] }}

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Email

                            </th>

                            <td>

                                {{ student[1] }}

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Phone

                            </th>

                            <td>

                                {{ student[2] }}

                            </td>

                        </tr>

                        <tr>

                            <th>

                                Username

                            </th>

                            <td>

                                {{ student[3] }}

                            </td>

                        </tr>

                    </table>

                    <div class="d-grid gap-3 mt-4">

                        <a href="/student_dashboard"
                           class="btn btn-primary">

                            <i class="bi bi-house-fill"></i> Back to Dashboard

                        </a>

                        <a href="/student_change_password"
                           class="btn btn-warning">

                           <i class="bi bi-key-fill"></i> Change Password

                        </a>

                        <a href="/student_logout"
                           class="btn btn-danger">

                            <i class="bi bi-box-arrow-right"></i> Logout

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% include "_footer.html" %}

</body>

</html>
