<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Return Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>📖 Return Book</h3>

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <tr>
                    <th>Book</th>
                    <td>{{ record[2] }}</td>
                </tr>

                <tr>
                    <th>Member</th>
                    <td>{{ record[3] }}</td>
                </tr>

                <tr>
                    <th>Borrow Date</th>
                    <td>{{ record[4] }}</td>
                </tr>

                <tr>
                    <th>Due Date</th>
                    <td>{{ record[5] }}</td>
                </tr>

                <tr>
                    <th>Current Library Date</th>
                    <td>{{ today }}</td>
                </tr>

                <tr>
                    <th>Overdue Days</th>
                    <td>
                        {% if overdue_days > 0 %}
                            <span class="badge bg-danger">
                                {{ overdue_days }} Days
                            </span>
                        {% else %}
                            <span class="badge bg-success">
                                None
                            </span>
                        {% endif %}
                    </td>
                </tr>

                <tr>
                    <th>Fine</th>
                    <td>
                        <strong class="text-danger">
                            ₹{{ fine }}
                        </strong>
                    </td>
                </tr>

            </table>

            <form method="POST" action="/confirm_return/{{ record[0] }}">

                <button class="btn btn-success">
                    ✅ Confirm Return
                </button>

                <a href="/borrow_history" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
